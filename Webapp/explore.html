<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>استكشف — الأصل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=El+Messiri:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app-shell.css" />
  </head>
  <body class="app-page">
    <div class="top-bar">
      <div style="display: flex; gap: 2px">
        <a href="index.html" class="icon-btn" title="الموقع">⌂</a>
        <a href="client.html#explore" class="icon-btn" title="رجوع">←</a>
      </div>
      <h1>استكشف الحرفيين</h1>
      <span></span>
    </div>
    <div class="page-scroll" style="max-width: 640px">
      <div class="card">
        <div class="card-body">
          <div class="field">
            <label>المهنة</label>
            <select id="cat">
              <option value="">الكل</option>
            </select>
          </div>
          <div class="field">
            <label>المدينة</label>
            <input id="city" placeholder="مثال: الدار البيضاء" />
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="avail" />
            <span>المتاحون فقط</span>
          </label>
          <button type="button" class="btn btn-primary btn-block" id="go">بحث</button>
        </div>
      </div>
      <div id="out"></div>
    </div>
    <script src="js/moroccan-trades.js"></script>
    <script src="js/config.js"></script>
    <script src="js/static-app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/ui.js"></script>
    <script>
      (function () {
        if (!AlAselConfig.getToken()) location.href = 'login.html';
        var cat = document.getElementById('cat');
        MOROCCAN_TRADES.forEach(function (t) {
          var o = document.createElement('option');
          o.value = t.id;
          o.textContent = t.labelAr;
          cat.appendChild(o);
        });
        async function run() {
          document.getElementById('out').innerHTML = '<p class="empty-hint">…</p>';
          try {
            var data = await AlAselApi.listArtisans({
              category: cat.value || undefined,
              city: document.getElementById('city').value.trim() || undefined,
              available: document.getElementById('avail').checked || undefined,
            });
            var items = data.items || [];
            if (!items.length) {
              document.getElementById('out').innerHTML =
                '<p class="empty-hint">لا حرفيين — تحقق من الAPI أو أنشئ حساباً.</p>';
              return;
            }
            document.getElementById('out').innerHTML = items
              .map(function (a) {
                var href = 'artisan-profile.html?id=' + encodeURIComponent(a.id);
                return (
                  '<a class="card" style="display:block;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit" href="' +
                  href +
                  '"><div style="font-weight:800">' +
                  AlAselUi.escapeHtml(a.displayName || a.name || '—') +
                  '</div><div style="font-size:0.85rem;color:var(--muted)">' +
                  AlAselUi.escapeHtml(AlAselCategories.categoryLabel(a.domain || a.category || '')) +
                  '</div></a>'
                );
              })
              .join('');
          } catch (e) {
            document.getElementById('out').innerHTML =
              '<p class="empty-hint">' + AlAselUi.escapeHtml(e.message || String(e)) + '</p>';
          }
        }
        document.getElementById('go').onclick = run;
        run();
      })();
    </script>
  </body>
</html>
