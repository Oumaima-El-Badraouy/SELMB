<!DOCTYPE html>
<html dir="rtl" lang="ar" class="site-layout">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>تسجيل الدخول — الأصل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=El+Messiri:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/site-chrome.css" />
  </head>
  <body data-nav-active="auth" class="site-layout">
    <div id="site-nav-root"></div>
    <main class="site-body-flex page-scroll" style="max-width: 440px; margin: 0 auto; width: 100%; padding-top: 8px">
      <header class="auth-page-header">
        <span class="auth-page-eyebrow">أهلاً بك</span>
        <h1 class="auth-page-title">تسجيل الدخول</h1>
        <p style="margin: 10px 0 0; color: var(--muted); font-size: 0.95rem; font-weight: 600">أدخل بريدك وكلمة المرور للمتابعة</p>
      </header>
      <div class="card card--elevate" style="margin-top: 8px">
        <div class="card-body">
          <form id="f">
            <div class="field">
              <label for="email">البريد الإلكتروني</label>
              <input id="email" name="email" type="email" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">كلمة المرور</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <label class="checkbox-row">
              <input type="checkbox" id="remember" />
              <span>حفظ بيانات الدخول</span>
            </label>
            <button type="submit" class="btn btn-primary btn-block" id="go">دخول</button>
          </form>
          <p class="auth-links-row">
            <a href="register-client.html">حساب زبون</a>
            &nbsp;·&nbsp;
            <a href="register-artisan.html">حساب حرفي</a>
          </p>
        </div>
      </div>
      <p class="link-back-muted"><a href="index.html">← العودة للموقع العام</a></p>
    </main>
    <div id="site-footer-root"></div>
    <script src="js/site-chrome.js"></script>
    <script src="js/config.js"></script>
    <script src="js/static-app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      (function () {
        try {
          var qs = new URLSearchParams(location.search);
          if (qs.get('api') === '1') {
            AlAselConfig.setStaticApp(false);
          } else if (qs.get('static') === '1') {
            AlAselConfig.setStaticApp(true);
          }
        } catch (_) {}
        var REM = 'al_asel_remember';
        var KE = 'al_asel_saved_email';
        var KP = 'al_asel_saved_password';
        try {
          if (localStorage.getItem(REM) === '1') {
            document.getElementById('remember').checked = true;
            document.getElementById('email').value = localStorage.getItem(KE) || '';
            document.getElementById('password').value = localStorage.getItem(KP) || '';
          }
        } catch (_) {}
        document.getElementById('f').onsubmit = async function (e) {
          e.preventDefault();
          var btn = document.getElementById('go');
          btn.disabled = true;
          try {
            var data = await AlAselApi.login(
              document.getElementById('email').value,
              document.getElementById('password').value
            );
            if (document.getElementById('remember').checked) {
              localStorage.setItem(REM, '1');
              localStorage.setItem(KE, document.getElementById('email').value.trim());
              localStorage.setItem(KP, document.getElementById('password').value);
            } else {
              localStorage.removeItem(REM);
              localStorage.removeItem(KE);
              localStorage.removeItem(KP);
            }
            var next = new URLSearchParams(location.search).get('next');
            var allow = { 'explore.html': 1, 'request.html': 1, 'client.html': 1, 'artisan.html': 1, 'inbox.html': 1 };
            if (next && allow[next]) {
              location.href = next;
            } else {
              location.href = data.user.role === 'artisan' ? 'artisan.html' : 'client.html';
            }
          } catch (err) {
            AlAselUi.toast(err.message || String(err), 'error');
            btn.disabled = false;
          }
        };
      })();
    </script>
  </body>
</html>
